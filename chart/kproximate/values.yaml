# Default values for kproximate.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

imagePullSecrets: []
# - name: my-registry-secret

image:
  registry: "registry.example.com"
  tag: "latest"
  pullPolicy: IfNotPresent
  ## Override the default container image names.
  # Defaults to "kproximate-controller" and "kproximate-worker" if left empty.
  controllerImage: ""   # e.g. "kproximate-controller-fork"
  workerImage: ""       # e.g. "kproximate-worker-fork"

workerReplicaCount: 3

kproximate:
  config:
    ## Verbose logging
    debug: false

    ## The period to wait for a provisioned node to join the kubernetes cluster before the scaling 
    ## event is declared to have failed.
    waitSecondsForJoin: 120

    ## The period to wait for a new node to be provisioned and declared ready before the scaling 
    ## event is declared to have failed.
    waitSecondsForProvision: 120

    ## The required headroom used in scale down calculations expressed as a value between 0
    ## and 1. If a value below 0.2 is specified it will be ignored and the default value
    ## is used.
    loadHeadroom: 0.2

    ## The number of cores assigned to new kproximate nodes.
    kpNodeCores: 2

    ## Set true to disable SSH key injection.
    kpNodeDisableSsh: false

    ## The amount of memory assigned to new kproximate nodes in MiB.
    kpNodeMemory: 2048

    ## Set labels on kp nodes. A comma separated list of labels to apply to kp-nodes in 
    ## the format "some.key=somevalue". It is also possible to use values only known at 
    ## provisioning time using go templating. Currently the only supported template value
    ## is "targetHost" which is the name of the proxmox host on which the kp-node is to be
    ## provsioned e.g. "topology.kubernetes.io/zone={{ targetHost }}".
    kpNodeLabels: ""

    ## The prefix to use when naming new kproximate nodes.
    kpNodeNamePrefix: kp-node

    ## The name of the Proxmox template to use for new kproximate nodes.
    kpNodeTemplateName: null ## Required

    ## Set true to use Qemu-Exec to join nodes to the kubernetes cluster.
    kpQemuExecJoin: false

    ## Set true if using local storage for templates.
    kpLocalTemplateStorage: false
    
    ## The maximum number of kproximate nodes allowed.
    maxKpNodes: 3

    ## Set true to skip TLS checks for the Proxmox API.
    pmAllowInsecure: false

    ## Set true to enable debug output for Proxmox API calls.
    pmDebug: false

    ## The Proxmox API URL.
    pmUrl: null ## Required

    ## The Proxmox API token ID or user ID.
    pmUserID: null ## Required

    ## The number of seconds between polls of the cluster for scaling.
    pollInterval: 10

    ## The rabbitmq service address
    rabbitMQHost: kproximate-rabbitmq

    ## The rabbitmq service port
    rabbitMQPort: 5672

    ## Enable TLS connection if the rabbitMQ instance/cluster is TLS enabled
    rabbitMQTLS: false

  secrets:
    ## The command to use to join worker nodes to the kubernetes cluster.
    kpJoinCommand: "" 
    
    ## The user's Proxmox password
    pmPassword: "" ## Required if pmToken not set

    ## The Proxmox API token for the token ID.
    pmToken: "" ## Required if pmPassword not set

    ## The SSH public key to inject into the kproximate template.
    sshKey: ""

nameOverride: ""
fullnameOverride: ""

controllerPodAnnotations: {}
workerPodAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
             
tolerations: []

## RabbitMQ subchart values
## Only a subset of available values is exposed here. For full configuration options, refer to the upstream chart.
## Ref: https://github.com/CloudPirates-io/helm-charts/blob/main/charts/rabbitmq/values.yaml
rabbitmq:
  ## Set to false to manage RabbitMQ outside of this chart
  enabled: true

  auth:
    ## @param auth.username RabbitMQ default username
    username: kproximate
    ## @param auth.password RabbitMQ password (if empty, random password will be generated)
    password: ""
    ## @param auth.existingSecret Name of existing secret containing RabbitMQ credentials
    existingSecret: ""
    ## @param auth.existingPasswordKey Key in existing secret containing RabbitMQ password
    existingPasswordKey: "password"

  config:
    ## Logging configuration - ref: https://www.rabbitmq.com/docs/logging
    logging:
      ## @param config.logging.console.enabled Enable console logging (outputs to stdout/stderr instead of files)
      console:
        enabled: true
      ## @param config.logging.file.enabled Enable file logging (outputs to /var/log/rabbitmq/)
      file:
        enabled: false
      ## @param config.logging.level Log level for RabbitMQ (debug, info, warning, error, critical, none)
      level: "info"
    
  ## @section Metrics configuration
  metrics:
    ## @param metrics.enabled Enable RabbitMQ metrics (via prometheus plugin)
    enabled: false
    ## @param metrics.port RabbitMQ metrics port
    port: 15692
    ## @param metrics.serviceMonitor.enabled Create ServiceMonitor for Prometheus monitoring
    serviceMonitor:
      enabled: false
  
  ## @param additionalPlugins Additional default RabbitMQ plugins to enable (Prometheus Metrics, PeerDiscoveryK8s and Management plugins are automatically added)
  additionalPlugins: []
  ## @param installPlugins Additional 3rd party RabbitMQ plugins to download and enable
  installPlugins: []
  
  persistence:
    enabled: false

  resources: {}
  ## We usually recommend not to specify default resources and to leave this as a conscious
  ## choice for the user. This also increases chances charts run on environments with little
  ## resources, such as Minikube. If you do want to specify resources, uncomment the following
  ## lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   memory: 2Gi
  # requests:
  #   cpu: 100m
  #   memory: 1Gi

  affinity:
    nodeAffinity: 
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  
  ## @param extraEnvVars Additional environment variables to set
  extraEnvVars: []
    # - name: CUSTOM_VAR
    #   value: "custom-value"
    # - name: SECRET_VAR
    #   valueFrom:
    #     secretKeyRef:
    #       name: my-secret
    #       key: secret-key

  ## @param extraPorts Additional ports to add to the pod and service
  extraPorts: []
  # extraPorts:
  #   - name: tls
  #     port: 5671
  #     targetPort: tls
  #     containerPort: 5671
  #   - name: mqtt
  #     port: 1883
  #     targetPort: mqtt
  #     containerPort: 1883

